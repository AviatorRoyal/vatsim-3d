# HTTPS server, added once a Let's Encrypt certificate exists (deploy-ec2.sh --https).
# GitHub Pages can only call an HTTPS API, so this is what the Pages frontend uses for /api/.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 16-4-34-135.sslip.io;
    ssl_certificate /etc/letsencrypt/live/16-4-34-135.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/16-4-34-135.sslip.io/privkey.pem;
    include /etc/nginx/snippets/vatsim-3d-site.conf;
}
