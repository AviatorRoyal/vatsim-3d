# nginx site (port 80), installed as /etc/nginx/sites-available/vatsim-3d by deploy/remote-install.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    include /etc/nginx/snippets/vatsim-3d-site.conf;
}
