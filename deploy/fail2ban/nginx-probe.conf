# fail2ban filter: requests for things this site never serves, which only scanners ask for:
# dotfiles (.env, .git/config, .aws/credentials …, but not /.well-known/), any .php,
# WordPress / phpMyAdmin / cgi-bin paths. Only counted when nginx refused them (404/444/400).
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[A-Z]+ /(?:[^ "?]*/)?(?:\.(?!well-known/)[^ "/?]+|[^ "?]*\.php[0-9]?|wp-(?:admin|login|includes|content)[^ "]*|xmlrpc[^ "]*|phpmyadmin[^ "]*|pma[^ "]*|cgi-bin/[^ "]*|vendor/phpunit[^ "]*)(?:[?/][^ "]*)? HTTP/[0-9.]+" (?:400|404|444) 
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z
