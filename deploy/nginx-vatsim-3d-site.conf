# Shared by the HTTP and HTTPS servers (installed as /etc/nginx/snippets/vatsim-3d-site.conf).
root /var/www/vatsim-3d;
index index.html;
location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
# Scanner bait (dotfiles except /.well-known/, PHP): close the connection without a reply.
# fail2ban (nginx-probe jail) bans addresses that keep asking.
location ~ /\.(?!well-known/) { return 444; }
location ~* \.php[0-9]?$ { return 444; }
location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_read_timeout 15s;
}
gzip on;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json;
